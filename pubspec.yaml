name: growth_ring
description: "年轮 · 一本会越来越懂你的日记本"
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  provider: ^6.1.5

  # 本地存储
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  # 网络
  http: ^1.6.0

  # 校验下载下来的安装包（update.json 里填了 sha256 才用得上）
  crypto: ^3.0.8

  # 日期格式化
  intl: ^0.20.3

  # PDF 导出
  pdf: ^3.13.1
  printing: ^5.15.1
  aptabase_flutter: ^0.5.0
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  # 日记正文与 PDF 排版使用的中文字体（霞鹜文楷，SIL OFL 1.1）
  fonts:
    - family: WenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai-Regular.ttf
